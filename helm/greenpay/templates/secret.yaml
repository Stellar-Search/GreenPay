{{- if and (eq .Values.secrets.provider "inline") (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: greenpay-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_PASSWORD_PREVIOUS: {{ default "" .Values.secrets.postgresPasswordPrevious | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}
  DATABASE_URL: "postgres://{{ .Values.secrets.postgresUser }}:{{ .Values.secrets.postgresPassword }}@postgres-svc:5432/{{ .Values.secrets.postgresDb }}"
  DATABASE_URL_PREVIOUS: {{ if .Values.secrets.postgresPasswordPrevious }}"postgres://{{ .Values.secrets.postgresUser }}:{{ .Values.secrets.postgresPasswordPrevious }}@postgres-svc:5432/{{ .Values.secrets.postgresDb }}"{{ else }}""{{ end }}
  RESEND_API_KEY: {{ .Values.secrets.resendApiKey | quote }}
  ADMIN_API_KEY: {{ .Values.secrets.adminApiKey | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.awsSecretAccessKey | quote }}
  CREDENTIAL_ISSUED_AT_POSTGRES: {{ default "" .Values.secrets.credentialIssuedAtPostgres | quote }}
  CREDENTIAL_ISSUED_AT_ADMIN: {{ default "" .Values.secrets.credentialIssuedAtAdmin | quote }}
{{- end }}
