apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    app: backend
  annotations:
    reloader.stakater.com/auto: "true"
    secret.reloader.stakater.com/reload: {{ include "greenpay.secretName" . | quote }}
spec:
  replicas: {{ .Values.backend.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Give the app's SHUTDOWN_TIMEOUT_MS (25s, see backend/src/server.js)
      # room to finish draining before the kubelet sends SIGKILL.
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds | default 30 }}
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: greenpay-config
            - secretRef:
                name: {{ include "greenpay.secretName" . }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  strategy:
    canary:
      canaryService: backend-canary
      stableService: backend-stable
      trafficRouting:
        nginx:
          stableIngress: backend-ingress
          additionalIngressAnnotations:
            canary-by-header: X-Canary
      analysis:
        templates:
          - templateName: backend-error-rate
          - templateName: backend-latency
        startingStep: 2
        args:
          - name: service
            value: backend-canary.{{ .Values.namespace }}.svc.cluster.local
      steps:
        - setWeight: {{ .Values.backend.canary.steps.initialWeight | default 10 }}
        - pause: { duration: {{ .Values.backend.canary.steps.initialPause | default "2m" }} }
        - setWeight: {{ .Values.backend.canary.steps.midWeight | default 30 }}
        - pause: { duration: {{ .Values.backend.canary.steps.midPause | default "2m" }} }
        - setWeight: {{ .Values.backend.canary.steps.highWeight | default 60 }}
        - pause: { duration: {{ .Values.backend.canary.steps.highPause | default "2m" }} }
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: backend-stable
  namespace: {{ .Values.namespace }}
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend-canary
  namespace: {{ .Values.namespace }}
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    {{- include "greenpay.ingress.tlsAnnotations" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- include "greenpay.ingress.tls" . | nindent 2 }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-stable
                port:
                  number: {{ .Values.backend.port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-canary-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "100"
    {{- include "greenpay.ingress.tlsAnnotations" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- include "greenpay.ingress.tls" . | nindent 2 }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-canary
                port:
                  number: {{ .Values.backend.port }}
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: backend-error-rate
  namespace: {{ .Values.namespace }}
spec:
  args:
    - name: service
  metrics:
    - name: error-rate
      interval: 1m
      count: 5
      successCondition: result[0] < 0.05
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus.{{ .Values.monitoring.namespace | default "monitoring" }}.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{
              service="{{`{{args.service}}`}}",
              code=~"5.*"
            }[2m])) /
            sum(rate(http_requests_total{
              service="{{`{{args.service}}`}}"
            }[2m]))
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: backend-latency
  namespace: {{ .Values.namespace }}
spec:
  args:
    - name: service
  metrics:
    - name: latency-p99
      interval: 1m
      count: 5
      successCondition: result[0] < 500
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus.{{ .Values.monitoring.namespace | default "monitoring" }}.svc.cluster.local:9090
          query: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket{
                service="{{`{{args.service}}`}}"
              }[2m])) by (le)
            ) * 1000
