{{- if eq .Values.secrets.provider "external" }}
{{- if .Values.secrets.external.createSecretStore }}
apiVersion: external-secrets.io/v1beta1
kind: {{ default "SecretStore" .Values.secrets.external.secretStoreKind }}
metadata:
  name: {{ .Values.secrets.external.secretStoreName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: greenpay
    app.kubernetes.io/part-of: greenpay
    app.kubernetes.io/component: secrets
spec:
  provider:
{{- if eq .Values.secrets.external.backend "vault" }}
    vault:
      server: {{ .Values.secrets.external.vault.server | quote }}
      path: {{ .Values.secrets.external.vault.path | quote }}
      version: {{ .Values.secrets.external.vault.version | quote }}
      auth:
        kubernetes:
          mountPath: {{ .Values.secrets.external.vault.mountPath | quote }}
          role: {{ .Values.secrets.external.vault.role | quote }}
{{- else if eq .Values.secrets.external.backend "gcp" }}
    gcpsm:
      projectID: {{ .Values.secrets.external.gcp.projectId | quote }}
{{- else if eq .Values.secrets.external.backend "azure" }}
    azurekv:
      vaultUrl: {{ .Values.secrets.external.azure.vaultUrl | quote }}
{{- else }}
    aws:
      service: {{ default "SecretsManager" .Values.secrets.external.aws.service | quote }}
      region: {{ default "us-east-1" .Values.secrets.external.aws.region | quote }}
{{- end }}
---
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: greenpay-external-secret
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: greenpay
    app.kubernetes.io/part-of: greenpay
    app.kubernetes.io/component: secrets
spec:
  refreshInterval: {{ default "1h" .Values.secrets.external.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.external.secretStoreName }}
    kind: {{ default "SecretStore" .Values.secrets.external.secretStoreKind }}
  target:
    name: {{ include "greenpay.secretName" . }}
    creationPolicy: {{ default "Owner" .Values.secrets.external.creationPolicy }}
    deletionPolicy: {{ default "Retain" .Values.secrets.external.deletionPolicy }}
  dataFrom:
    - extract:
        key: {{ .Values.secrets.external.remoteKey | quote }}
{{- end }}
