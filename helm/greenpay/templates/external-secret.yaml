{{- if eq .Values.secrets.provider "external" }}
{{- if .Values.secrets.external.createSecretStore }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ .Values.secrets.external.secretStoreName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: greenpay
    app.kubernetes.io/part-of: greenpay
spec:
  provider:
{{ if eq .Values.secrets.external.backend "vault" }}
    vault:
      server: {{ .Values.secrets.external.vault.server | quote }}
      path: {{ .Values.secrets.external.vault.path | quote }}
      version: {{ .Values.secrets.external.vault.version | quote }}
      auth:
        kubernetes:
          mountPath: {{ .Values.secrets.external.vault.mountPath | quote }}
          role: {{ .Values.secrets.external.vault.role | quote }}
{{ else }}
    aws:
      service: {{ .Values.secrets.external.aws.service | quote }}
      region: {{ .Values.secrets.external.aws.region | quote }}
{{ end }}
---
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: greenpay-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: greenpay
    app.kubernetes.io/part-of: greenpay
spec:
  refreshInterval: {{ .Values.secrets.external.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.external.secretStoreName }}
    kind: {{ .Values.secrets.external.secretStoreKind }}
  target:
    name: {{ include "greenpay.secretName" . }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.secrets.external.remoteKey | quote }}
{{- end }}
