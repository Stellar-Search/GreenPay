# GreenPay Helm chart — BASE DEFAULTS (testnet).
#
# This file is the safe-by-default baseline: it targets Stellar **testnet**,
# uses a placeholder ingress host and a well-known development password. It is
# suitable for local clusters, CI and testnet staging, and for nothing else.
#
# Mainnet is deployed by layering the overlay on top of this file:
#
#   helm upgrade --install greenpay helm/greenpay \
#     -f helm/greenpay/values.yaml \
#     -f helm/greenpay/values-mainnet.yaml \
#     --set config.contractId=<deployed mainnet contract id>
#
# Before any `helm upgrade`, run the pre-deploy guard, which renders the merged
# values and rejects mismatched network/URL/secret combinations:
#
#   node scripts/validate-helm-release.js \
#     -f helm/greenpay/values.yaml -f helm/greenpay/values-mainnet.yaml \
#     --expect-network mainnet
#
# See docs/deployment-mainnet.md.

namespace: greenpay

backend:
  image: greenpay/backend:latest
  replicas: 2
  port: 4000
  # Must stay above the app's SHUTDOWN_TIMEOUT_MS (25s, see backend/src/server.js)
  # so a graceful shutdown can finish before the kubelet sends SIGKILL.
  terminationGracePeriodSeconds: 30
  # PodDisruptionBudget — keeps at least one backend pod available during
  # voluntary disruptions (node drain, cluster-autoscaler scale-down).
  # maxUnavailable: 1 means at most 1 of the 2 replicas may be evicted at once.
  pdb:
    enabled: true
    maxUnavailable: 1
  canary:
    steps:
      initialWeight: 10
      initialPause: 2m
      midWeight: 30
      midPause: 2m
      highWeight: 60
      highPause: 2m
    analysis:
      errorRateThreshold: 0.05
      latencyP99Threshold: 500
      interval: 1m
      count: 5
      failureLimit: 3

frontend:
  image: greenpay/frontend:latest
  replicas: 2
  port: 3000
  # PodDisruptionBudget — keeps at least one frontend pod available during
  # voluntary disruptions. maxUnavailable: 1 at 2 replicas = 1 always up.
  pdb:
    enabled: true
    maxUnavailable: 1
  canary:
    steps:
      initialWeight: 10
      initialPause: 2m
      midWeight: 30
      midPause: 2m
      highWeight: 60
      highPause: 2m
    analysis:
      errorRateThreshold: 0.05
      interval: 1m
      count: 5
      failureLimit: 3

# summary-worker PDB values (Deployment managed via ml-workloads/summary-worker.yaml)
summaryWorker:
  # PodDisruptionBudget — 2 replicas; maxUnavailable: 1 keeps one worker
  # processing the pg-boss queue during voluntary node disruptions.
  pdb:
    enabled: true
    maxUnavailable: 1

# ml-inference PDB values (Deployment managed via ml-workloads/ml-inference.yaml)
mlInference:
  # PodDisruptionBudget — HPA minReplicas is 1, so we MUST use maxUnavailable
  # rather than minAvailable: 1. A minAvailable: 1 PDB would permanently block
  # eviction once the HPA scales to its minimum, hanging node drains forever.
  pdb:
    enabled: true
    maxUnavailable: 1

monitoring:
  namespace: monitoring
  prometheusAddress: http://prometheus.monitoring.svc.cluster.local:9090

postgres:
  image: postgres:16-alpine
  storage: 5Gi
  walBucket: greenpay-wal-backups
  awsRegion: us-east-1

config:
  # stellarNetwork is the single source of truth for which network every
  # component talks to. The guard cross-checks every URL below against it.
  stellarNetwork: testnet
  horizonUrl: https://horizon-testnet.stellar.org
  sorobanRpcUrl: https://soroban-testnet.stellar.org
  contractId: ""
  usdcIssuer: ""
  emailFrom: "GreenPay <updates@yourdomain.com>"

secrets:
  # existingSecret: when set, the chart does NOT render a Secret and instead
  # mounts the named, pre-existing Secret. Mainnet uses this so no production
  # credential is ever written into a values file. The Secret must supply
  # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, DATABASE_URL, RESEND_API_KEY
  # and ADMIN_API_KEY (AWS_* optional).
  existingSecret: ""
  postgresUser: postgres
  # Development-only default. The guard rejects this value on mainnet.
  postgresPassword: changeme
  postgresDb: greenpay
  resendApiKey: ""
  adminApiKey: ""
  awsAccessKeyId: ""
  awsSecretAccessKey: ""

ingress:
  host: greenpay.local
  className: nginx
  tls:
    enabled: false
    secretName: greenpay-tls
