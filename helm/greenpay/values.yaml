# GreenPay Helm chart — BASE DEFAULTS (testnet).
#
# This file is the safe-by-default baseline: it targets Stellar **testnet**,
# uses a placeholder ingress host, and renders no live default password. It is
# suitable for local clusters, CI and testnet staging, and for nothing else.
#
# Mainnet is deployed by layering the overlay on top of this file:
#
#   helm upgrade --install greenpay helm/greenpay \
#     -f helm/greenpay/values.yaml \
#     -f helm/greenpay/values-mainnet.yaml \
#     --set config.contractId=<deployed mainnet contract id>
#
# Before any `helm upgrade`, run the pre-deploy guard, which renders the merged
# values and rejects mismatched network/URL/secret combinations:
#
#   node scripts/validate-helm-release.js \
#     -f helm/greenpay/values.yaml -f helm/greenpay/values-mainnet.yaml \
#     --expect-network mainnet
#
# See docs/deployment-mainnet.md.

namespace: greenpay

backend:
  image: greenpay/backend:latest
  replicas: 2
  port: 4000
  # Must stay above the app's SHUTDOWN_TIMEOUT_MS (25s, see backend/src/server.js)
  # so a graceful shutdown can finish before the kubelet sends SIGKILL.
  terminationGracePeriodSeconds: 30
  # PodDisruptionBudget — keeps at least one backend pod available during
  # voluntary disruptions (node drain, cluster-autoscaler scale-down).
  # maxUnavailable: 1 means at most 1 of the 2 replicas may be evicted at once.
  pdb:
    enabled: true
    maxUnavailable: 1
  # HPA targets the Argo Rollout (not a Deployment). minReplicas matches the
  # HA floor so topologySpreadConstraints (maxSkew: 1) still have two pods to
  # place. CPU uses metrics-server; latency/queue-depth need prometheus-adapter.
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    cpuUtilization: 60
    latency:
      enabled: true
      metric: greenpay_backend_request_latency_p95_ms
      targetValue: "400"
    queueDepth:
      enabled: true
      metric: greenpay_backend_queue_depth
      targetValue: "25"
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        pods: 4
        percent: 100
        periodSeconds: 15
      scaleDown:
        stabilizationWindowSeconds: 300
        percent: 25
        periodSeconds: 60
  canary:
    steps:
      initialWeight: 10
      initialPause: 2m
      midWeight: 30
      midPause: 2m
      highWeight: 60
      highPause: 2m
    analysis:
      errorRateThreshold: 0.05
      latencyP99Threshold: 500
      interval: 1m
      count: 5
      failureLimit: 3

frontend:
  image: greenpay/frontend:latest
  replicas: 2
  port: 3000
  # PodDisruptionBudget — keeps at least one frontend pod available during
  # voluntary disruptions. maxUnavailable: 1 at 2 replicas = 1 always up.
  pdb:
    enabled: true
    maxUnavailable: 1
  # HPA targets the frontend Rollout. CPU + per-pod RPS (prometheus-adapter).
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    cpuUtilization: 70
    rps:
      enabled: true
      metric: http_requests_per_second
      targetAverageValue: "40"
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        pods: 4
        percent: 100
        periodSeconds: 15
      scaleDown:
        stabilizationWindowSeconds: 300
        percent: 25
        periodSeconds: 60
  canary:
    steps:
      initialWeight: 10
      initialPause: 2m
      midWeight: 30
      midPause: 2m
      highWeight: 60
      highPause: 2m
    analysis:
      errorRateThreshold: 0.05
      interval: 1m
      count: 5
      failureLimit: 3

# summary-worker PDB values (Deployment managed via ml-workloads/summary-worker.yaml)
summaryWorker:
  # PodDisruptionBudget — 2 replicas; maxUnavailable: 1 keeps one worker
  # processing the pg-boss queue during voluntary node disruptions.
  pdb:
    enabled: true
    maxUnavailable: 1

# ml-inference PDB values (Deployment managed via ml-workloads/ml-inference.yaml)
mlInference:
  # PodDisruptionBudget — HPA minReplicas is 1, so we MUST use maxUnavailable
  # rather than minAvailable: 1. A minAvailable: 1 PDB would permanently block
  # eviction once the HPA scales to its minimum, hanging node drains forever.
  pdb:
    enabled: true
    maxUnavailable: 1

monitoring:
  namespace: monitoring
  prometheusAddress: http://prometheus.monitoring.svc.cluster.local:9090

postgres:
  image: postgres:16-alpine
  storage: 5Gi
  walBucket: greenpay-wal-backups
  awsRegion: us-east-1

config:
  # stellarNetwork is the single source of truth for which network every
  # component talks to. The guard cross-checks every URL below against it.
  stellarNetwork: testnet
  horizonUrl: https://horizon-testnet.stellar.org
  sorobanRpcUrl: https://soroban-testnet.stellar.org
  contractId: ""
  usdcIssuer: ""
  emailFrom: "GreenPay <updates@yourdomain.com>"

secrets:
  # inline    — chart renders a Kubernetes Secret from the fields below.
  #             Passwords are empty in git; pass them with --set for local clusters.
  # external  — chart renders an ExternalSecret (and optional SecretStore) that
  #             materializes the workload Secret from AWS Secrets Manager or Vault.
  #             This is the mainnet path. Requires the External Secrets Operator.
  #
  # existingSecret: when set with provider=inline, the chart renders no Secret
  # and every workload mounts that pre-existing name instead.
  provider: inline
  existingSecret: ""
  postgresUser: postgres
  # Empty in git on purpose. A live default (e.g. changeme) would ship in every
  # `helm template` of the defaults. Local clusters must --set this; mainnet
  # never uses inline credentials. The pre-deploy guard still rejects known
  # defaults and short passwords if an inline Secret is rendered on mainnet.
  postgresPassword: ""
  postgresDb: greenpay
  resendApiKey: ""
  adminApiKey: ""
  awsAccessKeyId: ""
  awsSecretAccessKey: ""
  external:
    # When true the chart also renders the SecretStore. Set false if the
    # cluster already has one and only the ExternalSecret is needed.
    createSecretStore: true
    secretStoreName: greenpay-secret-store
    secretStoreKind: SecretStore
    refreshInterval: 1h
    # JSON secret in the backend whose keys match the workload Secret:
    # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, DATABASE_URL,
    # RESEND_API_KEY, ADMIN_API_KEY (AWS_* optional).
    remoteKey: greenpay/credentials
    # aws (Secrets Manager) or vault
    backend: aws
    aws:
      region: us-east-1
      service: SecretsManager
    vault:
      server: ""
      path: secret
      version: "v2"
      mountPath: kubernetes
      role: greenpay

ingress:
  host: greenpay.local
  className: nginx
  # TLS is off in the testnet defaults (HTTP on greenpay.local). The mainnet
  # overlay turns it on. ingress.tls.enabled is the enableTLS switch;
  # ingress.tls.secretName is the tlsSecretName the Ingress spec.tls block
  # and cert-manager both write into.
  tls:
    enabled: false
    secretName: greenpay-tls
    # Empty here so testnet renders no cert-manager annotation. Mainnet sets
    # this to the ClusterIssuer the chart (or the operator) creates.
    clusterIssuer: ""

# cert-manager ClusterIssuer the production overlay enables. The chart does
# not install cert-manager itself — that is a cluster prerequisite (see
# docs/deployment-mainnet.md). Disabled on testnet so `helm template` of the
# defaults never emits a cluster-scoped ACME issuer.
certManager:
  enabled: false
  clusterIssuerName: letsencrypt-prod
  acme:
    # REQUIRED at deploy time on mainnet: --set certManager.acme.email=ops@...
    email: ""
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretName: letsencrypt-prod-account-key
