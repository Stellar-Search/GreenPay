# CI-only stand-ins for the values the mainnet overlay deliberately leaves
# empty because they are supplied at deploy time (contract id, ingress host,
# sender address, ACME contact email).
#
# This file exists so CI can render the *committed* mainnet overlay end-to-end
# and assert it contains no testnet leakage. It is never used for a real
# deploy, and it contains no credentials — mainnet secrets come from the
# pre-existing Kubernetes Secret named in values-mainnet.yaml.

config:
  contractId: CADPZJDGZXQCZM4E4C3P42TRPCXOJTHOI4RTZQCV3IOMHFXQPBHQ7UGH
  emailFrom: "GreenPay <updates@greenpay-ci.example.org>"

ingress:
  host: greenpay-ci.example.org

certManager:
  acme:
    email: ops@greenpay-ci.example.org
