[package]
name = "dao-governance-contract"
version = "0.1.0"
edition = "2021"
description = "GreenPay DAO Governance — vote-escrowed GP token, snapshotting, and multi-stage proposal lifecycle"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "21.7.7"

[dev-dependencies]
soroban-sdk = { version = "21.7.7", features = ["testutils"] }
proptest = "1.4"
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }

[features]
testutils = ["soroban-sdk/testutils"]

