[package]
name = "greenpay-contract"
version = "0.1.0"
edition = "2021"
description = "Stellar GreenPay — Soroban smart contract for transparent climate donations"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "21.7.7"

[dev-dependencies]
soroban-sdk = { version = "21.7.7", features = ["testutils"] }
proptest = "1.4"
# Pin below 3.x: ed25519-dalek 3 pulls rand_core 0.10 and breaks soroban-env-host testutils.
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
# Test-only JSON handling for the resource-budget baselines
# (contracts/resource-budgets.json). Dev-dependencies never ship in the WASM.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
testutils = ["soroban-sdk/testutils"]

