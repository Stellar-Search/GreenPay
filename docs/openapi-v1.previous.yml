          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/{id}/matching:
    get:
      tags: [Projects]
      summary: List active donation matches for a project
      operationId: listProjectMatches
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: List of active matches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DonationMatch'
    post:
      tags: [Projects]
      summary: Create a donation matching offer
      operationId: createProjectMatch
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matcherAddress, capXLM, multiplier, expiresAt]
              properties:
                matcherAddress:
                  type: string
                capXLM:
                  type: number
                  example: 5000.0
                multiplier:
                  type: number
                  minimum: 1
                  example: 2
                expiresAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Match created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DonationMatch'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/{id}/generate-summary:
    post:
      tags: [Projects]
      summary: Generate AI impact summary for a project
      operationId: generateProjectSummary
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adminAddress]
              properties:
                adminAddress:
                  type: string
                  description: Must match the project wallet address (owner only)
      responses:
        '200':
          description: AI summary generated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          aiSummary:
                            type: string
                          aiSummaryGeneratedAt:
                            type: string
                            format: date-time
                          aiSummaryModel:
                            type: string
                          aiSummarySourceHash:
                            type: string
        '400':
          description: Missing adminAddress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Only the project owner can generate a summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: AI feature not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Donations ────────────────────────────────────────────────────────────────
  /api/donations:
    post:
      tags: [Donations]
      summary: Record a donation
      operationId: recordDonation
      description: Records an already-submitted on-chain donation. Idempotent by transactionHash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, donorAddress, transactionHash]
              properties:
                projectId:
                  type: string
                  format: uuid
                donorAddress:
                  type: string
                  example: GABC...XYZ
                amountXLM:
                  type: number
                  example: 100.0
                amount:
                  type: number
                currency:
                  type: string
                  default: XLM
                message:
                  type: string
                  maxLength: 100
                transactionHash:
                  type: string
                  pattern: '^[a-fA-F0-9]{64}$'
      responses:
        '201':
          description: Donation recorded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Donation'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded

  /api/donations/project/{projectId}:
    get:
      tags: [Donations]
      summary: List donations for a project
      operationId: listProjectDonations
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/cursorParam'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated donations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Donation'
                      nextCursor:
                        type: string
                        format: date-time
                        nullable: true

  /api/donations/project/{projectId}/messages:
    get:
      tags: [Donations]
      summary: List donations with messages for a project
      operationId: listProjectDonationMessages
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/cursorParam'
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        '200':
          description: Donations with messages, sorted by amount
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Donation'

  /api/donations/donor/{publicKey}:
    get:
      tags: [Donations]
      summary: List donations by a donor
      operationId: listDonorDonations
      parameters:
        - $ref: '#/components/parameters/publicKey'
        - $ref: '#/components/parameters/cursorParam'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        '200':
          description: Paginated donations by this donor
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Donation'
        '400':
          description: Invalid public key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

