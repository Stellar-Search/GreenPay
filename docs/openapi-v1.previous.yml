openapi: 3.0.3
info:
  title: Stellar GreenPay API
  version: 1.0.0
  description: |
    REST API for the Stellar GreenPay climate donation platform.
    Every donation is recorded on the Stellar blockchain via Soroban smart contracts.
    All `/api/v1/*` JSON responses use a single envelope. Successful responses
    are `{ success: true, data, meta? }`; error responses are
    `{ success: false, error: { code, message, details? } }`. The unversioned
    `/api/*` paths are legacy aliases that redirect to `/api/v1/*`; clients
    should migrate to `/api/v1/*` and branch on `error.code`, never message text.
  license:
    name: MIT

servers:
  - url: http://localhost:4000
    description: Local development

tags:
  - name: Health
  - name: Projects
  - name: Donations
  - name: Profiles
  - name: Leaderboard
  - name: Updates
  - name: Subscriptions
  - name: Jobs
  - name: Stats
  - name: Impact
  - name: Ratings
  - name: Admin
  - name: Onboarding
    description: >-
      Graduated first-donation paths for donors who arrive without a wallet,
      without a funded account, or without both. Nothing here is custodial: the
      donor's key is generated in their browser or on their device and never
      transmitted, and the sponsored account-creation transaction is
      unsubmittable until the donor signs it themselves. Donors who already
      have a funded wallet never touch these endpoints — that flow is
      unchanged. See docs/adr/ADR-005-graduated-non-custodial-donor-onboarding.md.
  - name: Realtime
    description: >-
      Live donation feed delivery. Broadcasts fan out across every backend
      replica through a shared adapter; these endpoints let a client recover
      events missed while disconnected and let operators see delivery per pod.
      The full contract is documented in docs/realtime.md.

components:
  schemas:
    Success:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum: [true]
          example: true
        data:
          description: Endpoint-specific response payload.
        meta:
          type: object
          additionalProperties: true
          description: Optional response metadata such as pagination or cursors.

    Error:
      type: object
      required: [success, error]
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum: [false]
          example: false
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              example: PROJECT_NOT_FOUND
            message:
              type: string
              description: Human-readable display message.
              example: Project not found
            details:
              description: Optional structured diagnostic details.

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        category:
          type: string
          description: Localized category label. Use sourceCategory for the stable filter value.
        sourceCategory:
          type: string
          enum: [Reforestation, Solar Energy, Ocean Conservation, Clean Water, Wildlife Protection, Carbon Capture, Wind Energy, Sustainable Agriculture, Other]
        status:
          type: string
          enum: [active, completed, paused, rejected]
        location:
          type: string
        walletAddress:
          type: string
        raisedXLM:
          type: string
        donorCount:
          type: integer
        co2OffsetKg:
          type: number
          deprecated: true
          description: Legacy operator input. Donor-facing environmental outcomes use ImpactClaim records and are never derived from this field.
        verified:
          type: boolean
        onChainVerified:
          type: boolean
        tags:
          type: array
          items:
            type: string
        aiSummary:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sourceLanguage:
          type: string
          enum: [en, es, ar]
        contentLanguage:
          type: string
          enum: [en, es, ar]
        requestedLanguage:
          type: string
          enum: [en, es, ar]
          nullable: true
        contentDirection:
          type: string
          enum: [ltr, rtl]
        usedFallback:
          type: boolean
        machineTranslated:
          type: boolean

    ImpactClaim:
      type: object
      required: [id, projectId, claimType, quantity, uncertainty, methodology, measurementPeriod, baseline, evidence, provenance]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
          nullable: true
        claimType:
          type: string
          enum: [avoided_emissions, sequestration, offset]
        quantity:
          type: object
          properties:
            value: { type: string }
            lowerBound: { type: string }
            upperBound: { type: string }
            unit: { type: string }
        uncertainty:
          type: object
          properties:
            lowerBound: { type: string }
            upperBound: { type: string }
            confidencePercent: { type: number, nullable: true }
        methodology:
          type: object
          properties:
            id: { type: string, format: uuid }
            code: { type: string }
            name: { type: string }
            version: { type: string }
            limitations: { type: string }
            comparisonScope: { type: string }
        measurementPeriod:
          type: object
          properties:
            start: { type: string, format: date }
            end: { type: string, format: date }
        vintage:
          type: object
          nullable: true
        baseline:
          type: string
        evidence:
          type: array
          items: { type: object }
        provenance:
          type: object
          properties:
            status:
              type: string
              enum: [verified, operator_stated, unverified, revoked, expired]
            label: { type: string }
            assertedBy: { type: string }
            attestation: { type: object, nullable: true }

    Campaign:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        goalXLM:
          type: string
        raisedXLM:
          type: string
        deadline:
          type: string
          format: date-time
        progressPercent:
          type: integer
        completed:
          type: boolean
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Milestone:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        percentage:
          type: number
        reachedAt:
          type: string
          format: date-time
          nullable: true
        transactionHash:
          type: string
          nullable: true

    DonationMatch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        matcherAddress:
          type: string
        capXLM:
          type: string
        multiplier:
          type: number
        matchedXLM:
          type: string
        remainingXLM:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    Donation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        donorAddress:
          type: string
        amountXLM:
          type: string
          nullable: true
        amount:
          type: string
        currency:
          type: string
          example: XLM
        message:
          type: string
          nullable: true
        transactionHash:
          type: string
        createdAt:
          type: string
          format: date-time

    Profile:
      type: object
      properties:
        publicKey:
          type: string
        displayName:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        totalDonatedXLM:
          type: string
        projectsSupported:
          type: integer
        badges:
          type: array
          items:
            type: object
            properties:
              tier:
                type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        publicKey:
          type: string
        displayName:
          type: string
          nullable: true
        totalDonatedXLM:
          type: string
        projectsSupported:
          type: integer
        topBadge:
          type: string
          nullable: true

    ProjectUpdate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        sourceLanguage: { type: string, enum: [en, es, ar] }
        contentLanguage: { type: string, enum: [en, es, ar] }
        contentDirection: { type: string, enum: [ltr, rtl] }
        requestedLanguage: { type: string, enum: [en, es, ar], nullable: true }
        usedFallback: { type: boolean }
        machineTranslated: { type: boolean }

    ProjectSearchFacets:
      type: object
      description: Facet counts for the current filtered result set.
      properties:
        status:
          type: object
          additionalProperties:
            type: integer
        category:
          type: object
          additionalProperties:
            type: integer
        verified:
          type: object
          properties:
            "true":
              type: integer
            "false":
              type: integer
        location:
          type: object
          additionalProperties:
            type: integer
        fundingProgress:
          type: object
          additionalProperties:
            type: integer
          description: |
            Counts keyed by bucket — under25, 25to50, 50to75, over75, funded.

    ProjectSearchMeta:
      type: object
      description: Search metadata returned alongside project listings.
      properties:
        total:
          type: integer
          description: Total projects matching filters (before limit).
        search:
          type: string
          nullable: true
          description: Sanitized search term applied to the query.
        latencyMs:
          type: number
          format: float
          description: Server-side query latency in milliseconds.
        latencyBudgetMs:
          type: number
          format: float
          description: Target p95 latency budget (default 150ms).
        facets:
          $ref: '#/components/schemas/ProjectSearchFacets'
        ranking:
          type: object
          nullable: true
          additionalProperties:
            type: number
          description: Optional per-field ranking weight snapshot for debugging.

    ProjectListMeta:
      allOf:
        - $ref: '#/components/schemas/ProjectSearchMeta'

    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, in_escrow, completed]
        releaseTransactionHash:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Rating:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        donorAddress:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        review:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor:
          type: string
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        metadata:
          type: object
        ipAddress:
          type: string
        createdAt:
          type: string
          format: date-time

    ReplayedEvent:
      type: object
      description: One event recorded in the shared replay log.
      properties:
        cursor:
          type: string
          description: Opaque position of this event in the global feed.
          example: r:1787752099968-0
        name:
          type: string
          description: Socket.IO event name this was broadcast as.
          example: donation_event
        payload:
          type: object
          additionalProperties: true
          description: The event body, identical to what was broadcast live.
        emittedAt:
          type: string
          format: date-time

    ReplayMeta:
      type: object
      properties:
        reset:
          type: boolean
          description: >-
            True when the server cannot prove this reply is complete. The client
            must refetch current state from REST rather than appending `data` to
            its timeline. This is NOT the same as an empty `data` array, which
            legitimately means no events occurred.
        reason:
          type: string
          nullable: true
          enum: [NO_CURSOR, INVALID_CURSOR, CURSOR_FOREIGN, CURSOR_EXPIRED, STORE_UNAVAILABLE]
          description: >-
            Why the cursor could not be honoured. Null when `reset` is false.
            NO_CURSOR means the client has no timeline yet and simply starts from
            now, which is not a gap.
        degraded:
          type: boolean
          description: Whether the replay log is currently operating without its shared store.
        nextCursor:
          type: string
          nullable: true
          description: Cursor to resume the live feed from, and to chain further pages.
        recovery:
          type: string
          description: Human-readable statement of what the client should do next.

    RealtimeStatus:
      type: object
      description: Delivery status for one backend instance.
      properties:
        instanceId:
          type: string
          description: Identifies the responding pod. Changes on restart.
        mode:
          type: string
          enum: [single-process, redis-adapter]
          description: >-
            single-process is a supported local-development mode, not a fault —
            one process delivering to its own clients is complete delivery.
        degraded:
          type: boolean
        reason:
          type: string
          nullable: true
        delivery:
          type: string
          enum: [global, instance]
          description: >-
            global — this pod's broadcasts reach clients on every replica.
            instance — they reach only this pod's clients, so the feed is
            incomplete and clients should reconcile against REST.
        replay:
          type: object
          additionalProperties: true
          description: State of the replay log backing reconnect recovery.
        metrics:
          type: object
          description: Counters for this instance only.
          properties:
            instanceId: { type: string }
            currentConnections: { type: integer }
            peakConnections: { type: integer }
            connectionsOpened: { type: integer }
            connectionsClosed: { type: integer }
            eventsPublished:
              type: integer
              description: Broadcasts originated by this instance.
            fanoutObserved:
              type: integer
              description: >-
                Broadcasts received from other instances. Flat at zero on a pod
                holding connections, while others publish, is the signature of
                broken cross-replica delivery.
            publishFailures: { type: integer }
            replayRequests: { type: integer }
            replayResets:
              type: integer
              description: Replays that could not be honoured; a rising rate means clients are falling outside the retention window.

    Pagination:
      type: object
      description: Single standard pagination metadata contract used by all list endpoints.
      properties:
        nextCursor:
          type: string
          nullable: true
          description: Opaque versioned cursor for fetching the next page (null when no more items).
          example: v1.eyJjcmVhdGVkQXQiOiIyMDI2LTA4LTI2VDEyOjAwOjAwWiIsImlkIjoiYWJjZCJ9
        hasMore:
          type: boolean
          description: Whether additional items exist beyond the current page.
        limit:
          type: integer
          description: Page size cap requested or applied.
        totalCount:
          type: integer
          nullable: true
          description: Total count of items if calculated, or null if omitted/estimated.
        isTotalExact:
          type: boolean
          description: True if totalCount is exact; false if estimated or omitted.
        total:
          type: integer
          description: >-
            Deprecated alias of `totalCount`, kept so clients written against
            the offset-era envelope keep reading a count. Present only on the
            endpoints that still compute one.
          deprecated: true
        offset:
          type: integer
          description: >-
            Deprecated. Echoes the `offset` the caller sent, and is absent on
            cursor-paginated endpoints.
          deprecated: true

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    cursorParam:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque, versioned continuation cursor, taken verbatim from a previous
        response's `meta.pagination.nextCursor`. Its contents are not a stable
        API: decode or construct one and it may stop working. A malformed
        cursor is rejected with `INVALID_CURSOR`, and one issued by a newer
        format with `UNSUPPORTED_CURSOR_VERSION` — both HTTP 400. The full
        contract is documented once in docs/pagination.md.
      schema:
        type: string
    limitParam:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return per page.
      schema:
        type: integer
    projectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    publicKey:
      name: publicKey
      in: path
      required: true
      schema:
        type: string
        example: GABC...XYZ

  headers:
    AdminKey:
      description: Admin API key (only required when ADMIN_API_KEY env var is set)
      schema:
        type: string

paths:
  # ── Health ──────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                  network:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  indexer:
                    type: object

  # ── Projects ─────────────────────────────────────────────────────────────────
  /api/projects:
    get:
      tags: [Projects]
      summary: List projects
      operationId: listProjects
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [Reforestation, Solar Energy, Ocean Conservation, Clean Water, Wildlife Protection, Carbon Capture, Wind Energy, Sustainable Agriculture, Other]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, completed, paused]
        - name: verified
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/cursorParam'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: lang
          in: query
          description: Preferred donor-content language. Falls back to the labelled original.
          schema:
            type: string
            enum: [en, es, ar]
      responses:
        '200':
          description: List of projects with optional search metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'
                      meta:
                        $ref: '#/components/schemas/ProjectListMeta'

  /api/projects/featured:
    get:
      tags: [Projects]
      summary: Get featured project
      operationId: getFeaturedProject
      parameters:
        - name: lang
          in: query
          schema:
            type: string
            enum: [en, es, ar]
      description: Returns the active project with the highest donor count. Cached for 24 hours.
      responses:
        '200':
          description: Featured project
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '404':
          description: No featured project found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/admin/register:
    post:
      tags: [Projects]
      summary: Build on-chain project registration XDR
      operationId: adminRegisterProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, name, wallet, co2PerXLM, adminAddress]
              properties:
                projectId:
                  type: string
                name:
                  type: string
                wallet:
                  type: string
                co2PerXLM:
                  type: integer
                adminAddress:
                  type: string
      responses:
        '200':
          description: XDR for admin to sign
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          xdr:
                            type: string
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/admin/confirm:
    post:
      tags: [Projects]
      summary: Confirm on-chain project registration
      operationId: adminConfirmProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionHash, projectId]
              properties:
                transactionHash:
                  type: string
                projectId:
                  type: string
      responses:
        '200':
          description: Project updated as verified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'

  /api/projects/{id}:
    get:
      tags: [Projects]
      summary: Get project by ID
      operationId: getProject
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: lang
          in: query
          schema:
            type: string
            enum: [en, es, ar]
      responses:
        '200':
          description: Project detail with campaigns, milestones, ratings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Project'
                          - type: object
                            properties:
                              campaigns:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Campaign'
                              activeCampaign:
                                $ref: '#/components/schemas/Campaign'
                                nullable: true
                              averageRating:
                                type: number
                              ratingCount:
                                type: integer
                              milestones:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Milestone'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/{id}/translations/{language}:
    put:
      tags: [Projects]
      summary: Create or replace a pending project translation without changing the original
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: language
          in: path
          required: true
          schema:
            type: string
            enum: [en, es, ar]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, category, location]
              properties:
                name: { type: string }
                description: { type: string }
                category: { type: string }
                location: { type: string }
                machineTranslated: { type: boolean, default: false }
      responses:
        '201': { description: Translation saved in pending moderation }

  /api/projects/{id}/translations/{language}/moderation:
    patch:
      tags: [Projects]
      summary: Moderate project translation content
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: language
          in: path
          required: true
          schema: { type: string, enum: [en, es, ar] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, approved, rejected] }
                impactClaimsReviewed: { type: boolean, default: false }
      responses:
        '200': { description: Translation moderation state updated }
        '400': { description: Human impact-claim review is required before approving machine translation }

  /api/projects/{id}/status:
    patch:
      tags: [Projects]
      summary: Update project status
      operationId: updateProjectStatus
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, rejected, paused]
                reason:
                  type: string
                adminAddress:
                  type: string
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '400':
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/projects/{id}/verify:
    get:
      tags: [Projects]
      summary: Verify project on-chain
      operationId: verifyProject
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: On-chain verification result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          projectId:
                            type: string
                          onChainVerified:
                            type: boolean
                          contractRegisteredAt:
                            type: integer
                            nullable: true
                          totalRaisedOnChain:
                            type: string

  /api/projects/{id}/campaigns:
