              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Profile'
        '400':
          description: Invalid public key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/profiles:
    post:
      tags: [Profiles]
      summary: Create or update donor profile
      operationId: upsertProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicKey]
              properties:
                publicKey:
                  type: string
                displayName:
                  type: string
                  maxLength: 30
                bio:
                  type: string
                  maxLength: 300
      responses:
        '200':
          description: Profile created or updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Profile'
        '400':
          description: Invalid public key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Leaderboard ──────────────────────────────────────────────────────────────
  /api/leaderboard:
    get:
      tags: [Leaderboard]
      summary: Get donor leaderboard
      operationId: getLeaderboard
      parameters:
        - $ref: '#/components/parameters/cursorParam'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          deprecated: true
          description: >-
            Superseded by `cursor`. Honoured only when no `cursor` is supplied,
            so existing clients keep working unchanged, and it carries the
            offset caveats: rows written while a client pages can be duplicated
            or skipped, and deep offsets get slower with depth. See
            docs/pagination.md for the transition.
          schema:
            type: integer
            default: 0
            maximum: 10000
        - name: period
          in: query
          schema:
            type: string
            enum: [all, month, year]
            default: all
      responses:
        '200':
          description: Ranked donor list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/LeaderboardEntry'

  # ── Updates ──────────────────────────────────────────────────────────────────
  /api/updates/{projectId}:
    get:
      tags: [Updates]
      summary: List updates for a project
      operationId: listProjectUpdates
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/cursorParam'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: lang
          in: query
          description: Preferred update-content language with labelled source fallback.
          schema: { type: string, enum: [en, es, ar] }
      responses:
        '200':
          description: Paginated project updates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProjectUpdate'
                      nextCursor:
                        type: string
                        format: date-time
                        nullable: true

  /api/updates:
    post:
      tags: [Updates]
      summary: Post a project update (admin)
      operationId: createProjectUpdate
      parameters:
        - name: x-admin-key
          in: header
          description: Admin API key (required when ADMIN_API_KEY env var is set)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, title, body]
              properties:
                projectId:
                  type: string
                  format: uuid
                title:
                  type: string
                body:
                  type: string
                sourceLanguage:
                  type: string
                  enum: [en, es, ar]
                  default: en
      responses:
        '201':
          description: Update created and subscribers notified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ProjectUpdate'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/updates/{updateId}/translations/{language}:
    put:
      tags: [Updates]
      summary: Create or replace a pending update translation
      security: [{ bearerAuth: [] }]
      parameters:
        - name: updateId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: language
          in: path
          required: true
          schema: { type: string, enum: [en, es, ar] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string }
                body: { type: string }
                machineTranslated: { type: boolean, default: false }
      responses:
        '201': { description: Translation saved in pending moderation }

  /api/updates/{updateId}/translations/{language}/moderation:
    patch:
      tags: [Updates]
      summary: Moderate update translation content
      security: [{ bearerAuth: [] }]
      parameters:
        - name: updateId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: language
          in: path
          required: true
          schema: { type: string, enum: [en, es, ar] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, approved, rejected] }
                impactClaimsReviewed: { type: boolean, default: false }
      responses:
        '200': { description: Translation moderation state updated }
        '400': { description: Human impact-claim review is required before approving machine translation }

  /api/updates/{updateId}/like:
    post:
      tags: [Updates]
      summary: Toggle like on an update
      operationId: toggleUpdateLike
      parameters:
        - name: updateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [donorAddress]
              properties:
                donorAddress:
                  type: string
      responses:
        '200':
          description: Like toggled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          liked:
                            type: boolean
                          likeCount:
                            type: integer
        '400':
          description: Missing donorAddress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Update not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/updates/{updateId}/likes:
    get:
      tags: [Updates]
      summary: Get like count and user like status for an update
      operationId: getUpdateLikes
      parameters:
        - name: updateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: donorAddress
          in: query
          description: Check if this address has liked the update
          schema:
            type: string
      responses:
        '200':
          description: Like info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          likeCount:
                            type: integer
                          liked:
                            type: boolean

  # ── Subscriptions ────────────────────────────────────────────────────────────
  /api/subscriptions:
    post:
      tags: [Subscriptions]
      summary: Subscribe to project updates
      operationId: subscribeToProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, email]
              properties:
                projectId:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                donorAddress:
                  type: string
                preferredLanguage:
                  type: string
                  enum: [en, es, ar]
                  default: en
      responses:
        '201':
          description: Subscribed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Already subscribed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/subscriptions/{projectId}/count:
    get:
