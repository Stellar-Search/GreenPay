            type: string
            format: uuid
      responses:
        '200':
          description: Subscriber count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          count:
                            type: integer

