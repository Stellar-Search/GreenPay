name: Translation Check

on:
  pull_request:
    paths:
      - 'shared/locales/**'
      - 'frontend/locales/**'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-translations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check translations
        run: |
          node scripts/check-translations.js
