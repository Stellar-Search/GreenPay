name: OpenAPI Parity Check
on:
  pull_request:
    branches: [ develop, main ]

jobs:
  validate-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test backend/src/__tests__/openapi-parity.test.ts