name: Build and Release Extension

on:
  pull_request:
    paths:
      - 'extension/**'
      - '.github/workflows/extension.yml'
  push:
    branches:
      - main
    paths:
      - 'extension/**'
      - '.github/workflows/extension.yml'
    tags:
      - 'v*'

# Default token to read-only; the build job below overrides to contents:write
# since "Create Release" (tag pushes only) needs it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # "Create Release" below (tag pushes only) needs contents:write to
    # create the GitHub release and upload assets.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-node-install
        with:
          working-directory: extension

      - name: npm audit (fail on high/critical)
        working-directory: extension
        run: npx --yes audit-ci@7.1.0 --high --package-manager npm

      - name: Simulate service-worker termination and test recovery
        working-directory: extension
        run: npm test

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Build Firefox version
        working-directory: extension
        run: npm run build:firefox

      - name: Create distribution package
        run: |
          cd extension
          mkdir -p greenpay-extension
          cp manifest.json popup.html popup.css greenpay-extension/
          cp -r dist greenpay-extension/
          zip -r greenpay-extension.zip greenpay-extension/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: extension/greenpay-extension.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Firefox distribution
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd extension
          mkdir -p greenpay-extension-firefox
          cp manifest.firefox.json greenpay-extension-firefox/manifest.json
          cp popup.html popup.css greenpay-extension-firefox/
          cp -r dist-firefox greenpay-extension-firefox/
          zip -r greenpay-extension-firefox.zip greenpay-extension-firefox/

      - name: Upload Firefox artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: greenpay-extension-firefox
          path: extension/greenpay-extension-firefox.zip
