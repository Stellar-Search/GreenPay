name: Database Restore Drill (Game Day)

on:
  schedule:
    # Quarterly: 03:00 UTC on the 1st of Jan, Apr, Jul, Oct.
    - cron: '0 3 1 1,4,7,10 *'
  workflow_dispatch: {}

jobs:
  restore-drill:
    name: Run disaster-recovery restore drill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can access previous drill reports from git
          fetch-depth: 0

      - name: Install PostgreSQL client and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq bc

      - name: Run restore drill
        run: |
          bash scripts/db-restore-drill.sh

      - name: Parse drill results
        if: always()
        id: parse-results
        run: |
          # Find the most recent drill report
          REPORT_JSON=$(find docs/runbooks/drills -name "*.json" -type f | sort -r | head -1)
          if [ -z "$REPORT_JSON" ]; then
            echo "::error::No drill report generated"
            exit 1
          fi
          
          echo "report_json=$REPORT_JSON" >> "$GITHUB_OUTPUT"
          
          # Extract key metrics
          STATUS=$(jq -r '.status' "$REPORT_JSON")
          RTO=$(jq -r '.rto_seconds' "$REPORT_JSON")
          BACKUP_TIME=$(jq -r '.backup_seconds' "$REPORT_JSON")
          VERIFY_STATUS=$(jq -r '.verification_status // "UNKNOWN"' "$REPORT_JSON")
          REGRESSION=$(jq -r '.rto_rpo_regression_detected // false' "$REPORT_JSON")
          REGRESSION_REASON=$(jq -r '.rto_rpo_regression_reason // "(none)"' "$REPORT_JSON")
          
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "rto=$RTO" >> "$GITHUB_OUTPUT"
          echo "backup_time=$BACKUP_TIME" >> "$GITHUB_OUTPUT"
          echo "verify_status=$VERIFY_STATUS" >> "$GITHUB_OUTPUT"
          echo "regression=$REGRESSION" >> "$GITHUB_OUTPUT"
          echo "regression_reason=$REGRESSION_REASON" >> "$GITHUB_OUTPUT"

      - name: Check for regressions
        if: always()
        run: |
          STATUS="${{ steps.parse-results.outputs.status }}"
          REGRESSION="${{ steps.parse-results.outputs.regression }}"
          REGRESSION_REASON="${{ steps.parse-results.outputs.regression_reason }}"
          VERIFY_STATUS="${{ steps.parse-results.outputs.verify_status }}"
          
          echo "📊 Drill Results:"
          echo "  Status: $STATUS"
          echo "  Verification: $VERIFY_STATUS"
          echo "  RTO: ${{ steps.parse-results.outputs.rto }}s"
          echo "  Backup: ${{ steps.parse-results.outputs.backup_time }}s"
          echo "  Regression Detected: $REGRESSION"
          
          if [ "$STATUS" = "FAILED" ]; then
            echo "::error::Drill status: FAILED"
            exit 1
          fi
          
          if [ "$REGRESSION" = "true" ]; then
            echo "::warning::RTO/RPO Regression: $REGRESSION_REASON"
            # Note: we warn but don't fail for regressions in GitHub Actions
            # The drill script itself would have failed if regressions need to block
          fi
          
          if [ "$VERIFY_STATUS" != "PASSED" ]; then
            echo "::error::Verification failed: $VERIFY_STATUS"
            exit 1
          fi

      - name: Upload drill report and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-report-${{ github.run_number }}
          path: docs/runbooks/drills/*
          retention-days: 90
          if-no-files-found: warn

      - name: Create summary
        if: always()
        run: |
          REPORT_JSON="${{ steps.parse-results.outputs.report_json }}"
          
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## 🗄️ Database Restore Drill Results
          
          | Metric | Value |
          |--------|-------|
          | Status | ${{ steps.parse-results.outputs.status }} |
          | Verification | ${{ steps.parse-results.outputs.verify_status }} |
          | RTO (Recovery Time Objective) | ${{ steps.parse-results.outputs.rto }}s |
          | Backup Duration | ${{ steps.parse-results.outputs.backup_time }}s |
          | Regression Detected | ${{ steps.parse-results.outputs.regression }} |
          
          **Report:** [Download artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          **Key Checks Performed:**
          - ✅ Schema completeness (all 19 expected tables)
          - ✅ Event stream contiguity (no gaps in version sequences)
          - ✅ Monetary reconciliation (donation amounts validated)
          - ✅ CQRS projection consistency
          - ✅ Temporal consistency (created_at ≤ updated_at)
          - ✅ Foreign key integrity
          - ✅ RTO/RPO regression detection
          EOF

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: restore-drill
    if: failure()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse failure details
        id: failure-details
        run: |
          # Find the most recent drill report
          REPORT_JSON=$(find docs/runbooks/drills -name "*.json" -type f | sort -r | head -1 2>/dev/null)
          
          if [ -n "$REPORT_JSON" ] && [ -f "$REPORT_JSON" ]; then
            STATUS=$(jq -r '.status // "UNKNOWN"' "$REPORT_JSON")
            VERIFY_STATUS=$(jq -r '.verification_status // "UNKNOWN"' "$REPORT_JSON")
            REGRESSION=$(jq -r '.rto_rpo_regression_detected // false' "$REPORT_JSON")
            REGRESSION_REASON=$(jq -r '.rto_rpo_regression_reason // "(none)"' "$REPORT_JSON")
            RTO=$(jq -r '.rto_seconds // "unknown"' "$REPORT_JSON")
            
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "verify_status=$VERIFY_STATUS" >> "$GITHUB_OUTPUT"
            echo "regression=$REGRESSION" >> "$GITHUB_OUTPUT"
            echo "regression_reason=$REGRESSION_REASON" >> "$GITHUB_OUTPUT"
            echo "rto=$RTO" >> "$GITHUB_OUTPUT"
          else
            echo "status=UNKNOWN" >> "$GITHUB_OUTPUT"
            echo "verify_status=UNKNOWN" >> "$GITHUB_OUTPUT"
            echo "regression=unknown" >> "$GITHUB_OUTPUT"
            echo "regression_reason=Report file not found" >> "$GITHUB_OUTPUT"
            echo "rto=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Create issue on drill failure
        uses: actions/github-script@v7
        with:
          script: |
            const status = "${{ steps.failure-details.outputs.status }}";
            const verifyStatus = "${{ steps.failure-details.outputs.verify_status }}";
            const regression = "${{ steps.failure-details.outputs.regression }}";
            const regressionReason = "${{ steps.failure-details.outputs.regression_reason }}";
            const rto = "${{ steps.failure-details.outputs.rto }}";
            
            let failureType = "Restore Drill Failed";
            let severity = "🔴 Critical";
            let details = "";
            
            if (status === "FAILED" && verifyStatus !== "PASSED") {
              failureType = "Verification Failed - Data Integrity Issue";
              severity = "🔴 CRITICAL";
              details = `\n**Verification Status:** ${verifyStatus}\n\nThis may indicate:\n- Schema incomplete or tables missing\n- Event stream corrupted (gaps detected)\n- Data loss or corruption\n- Monetary reconciliation failed\n\nDo not deploy until resolved.`;
            } else if (regression === "true") {
              failureType = "RTO/RPO Regression Detected";
              severity = "🟠 Warning";
              details = `\n**Regression Details:** ${regressionReason}\n\nRTO/RPO have regressed compared to baseline. Investigate performance degradation.`;
            } else {
              details = `\n**Status:** ${status}\n**Verification:** ${verifyStatus}\n**RTO:** ${rto}s`;
            }
            
            const title = `${severity} ${failureType}`;
            const body = `## Quarterly Database Restore Drill Failed
            
Date: ${new Date().toISOString()}
Severity: ${severity}

### Summary

The quarterly disaster-recovery restore drill failed.

${details}

### What This Means

The backup mechanism may not be restorable, OR:
- The restore process is broken
- Database performance has degraded
- Data integrity checks are failing

This is treated as high priority because it's the last line of defense against data loss.

### Next Steps

1. Check the workflow run: [View Full Log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
2. See the drill report artifacts (CSV/JSON with detailed metrics)
3. Review [Restore Drill Runbook](../../docs/runbooks/db-restore-drill.md)
4. If verification failed: investigate data integrity immediately
5. If regression detected: investigate performance degradation
6. File a post-drill report documenting findings

### References

- Runbook: \`docs/runbooks/db-restore-drill.md\`
- Drill reports: \`docs/runbooks/drills/\`
- Backup script: \`scripts/backup-db.sh\`
- Restore script: \`scripts/restore-db.sh\`
- Verification script: \`scripts/verify-restore.sh\`
- Workflow: \`.github/workflows/db-restore-drill.yml\``;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'devops', 'backup', 'high-priority']
            });

  publish-metrics:
    name: Publish RTO/RPO Metrics
    runs-on: ubuntu-latest
    needs: restore-drill
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and publish metrics
        run: |
          # Find all drill reports
          echo "## RTO/RPO Metrics - Last 10 Drill Runs" > /tmp/metrics.md
          echo "" >> /tmp/metrics.md
          echo "| Date | RTO (s) | Backup (s) | Status | Verification |" >> /tmp/metrics.md
          echo "|------|---------|-----------|--------|--------------|" >> /tmp/metrics.md
          
          find docs/runbooks/drills -name "*.json" -type f | sort -r | head -10 | while read f; do
            if jq empty "$f" 2>/dev/null; then
              DRILL_ID=$(jq -r '.drill_id' "$f")
              RTO=$(jq -r '.rto_seconds // "N/A"' "$f")
              BACKUP=$(jq -r '.backup_seconds // "N/A"' "$f")
              STATUS=$(jq -r '.status // "N/A"' "$f")
              VERIFY=$(jq -r '.verification_status // "N/A"' "$f")
              echo "| $DRILL_ID | $RTO | $BACKUP | $STATUS | $VERIFY |" >> /tmp/metrics.md
            fi
          done
          
          echo "" >> /tmp/metrics.md
          echo "---" >> /tmp/metrics.md
          echo "" >> /tmp/metrics.md
          echo "**Notes:**" >> /tmp/metrics.md
          echo "- RTO: Recovery Time Objective (provision to verified restore)" >> /tmp/metrics.md
          echo "- Backup: Time to backup test database" >> /tmp/metrics.md
          echo "- Regression Detection: Baseline tracked in \`.baseline-rto-rpo.json\` (20% variance allowed)" >> /tmp/metrics.md
          echo "- Full reports available in \`docs/runbooks/drills/\`" >> /tmp/metrics.md
          
          cat /tmp/metrics.md

      - name: Comment on workflow run
        uses: actions/github-script@v7
        with:
          script: |
            console.log("RTO/RPO metrics published. See workflow summary for details.");
