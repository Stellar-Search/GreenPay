name: Database Restore Drill (Game Day)

on:
  schedule:
    # Quarterly: 03:00 UTC on the 1st of Jan, Apr, Jul, Oct.
    - cron: '0 3 1 1,4,7,10 *'
  workflow_dispatch: {}

jobs:
  restore-drill:
    name: Run disaster-recovery restore drill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run restore drill
        run: |
          bash scripts/db-restore-drill.sh

      - name: Upload drill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-report
          path: docs/runbooks/drills/*
          if-no-files-found: warn

      - name: Drill status check
        if: failure()
        run: |
          echo "::error::Restore drill failed. The nightly backup may not be restorable. Check the logs above."
          exit 1

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: restore-drill
    if: failure()

    steps:
      - name: Create issue on drill failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Database Restore Drill Failed';
            const body = `The quarterly disaster-recovery restore drill failed on ${new Date().toISOString()}.\n\nThis means the nightly backup may not currently be restorable — treat as high priority.\n\nSee the runbook: docs/runbooks/db-restore-drill.md\n\nCheck the workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'devops', 'backup']
            });
