name: Database Backup

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      storage_type:
        description: 'Storage type (s3 or gcs)'
        required: false
        default: 's3'

permissions:
  contents: read

jobs:
  backup-database:
    name: Backup PostgreSQL Database
    runs-on: ubuntu-latest
    # Only run on main branch (not on PRs or forks)
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Check required secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.DB_PASSWORD }}" ]; then
            echo "DB_PASSWORD secret not set - skipping backup"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if secrets missing
        if: steps.check-secrets.outputs.skip == 'true'
        run: |
          echo "Skipping backup - DB_PASSWORD not configured"
          exit 0

      - name: Configure AWS credentials
        if: github.event.inputs.storage_type != 'gcs' && steps.check-secrets.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Google Cloud SDK
        if: github.event.inputs.storage_type == 'gcs' && steps.check-secrets.outputs.skip != 'true'
        uses: google-github-actions/setup-gcloud@e30db14379863a8c79331b04a9969f4c1e225e0b # v1
        with:
          service_account_key: ${{ secrets.GCS_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Run database backup
        if: steps.check-secrets.outputs.skip != 'true'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME || 'greenpay' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          STORAGE_TYPE: ${{ github.event.inputs.storage_type || 's3' }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_PREFIX: ${{ secrets.S3_PREFIX || 'backups/' }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GCS_PREFIX: ${{ secrets.GCS_PREFIX || 'backups/' }}
          RETENTION_DAYS: ${{ secrets.BACKUP_RETENTION_DAYS || '30' }}
          BACKUP_DIR: /tmp/backups
        run: |
          bash scripts/backup-db.sh

      - name: Backup status check
        if: failure()
        run: |
          echo "::error::Database backup failed. Check the logs above."
          exit 1
