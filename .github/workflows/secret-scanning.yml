name: Secret Scanning

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks (Hardened)
        env:
          # 8.18.2 silently ignored the [[allowlists]] array form that
          # .gitleaks.toml is written in, so every allowlist in it was a no-op.
          # 8.28.0 parses it correctly.
          GITLEAKS_VERSION: "8.28.0"
          # From gitleaks_${GITLEAKS_VERSION}_checksums.txt on the release page.
          # Update both values together when bumping the version.
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          set -euo pipefail
          TEMP_DIR=$(mktemp -d)
          TARBALL="${TEMP_DIR}/gitleaks.tar.gz"
          
          curl --fail --proto '=https' --tlsv1.2 -sSL             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"             -o "$TARBALL"

          (cd "$TEMP_DIR" && echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -)

          tar -xzf "$TARBALL" -C "$TEMP_DIR" gitleaks
          sudo mv "${TEMP_DIR}/gitleaks" /usr/local/bin/gitleaks
          sudo chmod +x /usr/local/bin/gitleaks
          rm -rf "$TEMP_DIR"

      - name: Run Gitleaks secret scan
        run: |
          gitleaks detect             --source .             --config .gitleaks.toml             --redact             --verbose
