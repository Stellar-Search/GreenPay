apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend
  namespace: greenpay
  labels:
    app: backend
  annotations:
    reloader.stakater.com/auto: "true"
    secret.reloader.stakater.com/reload: "greenpay-secrets"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      schedulerName: default-scheduler
      # Give the app's SHUTDOWN_TIMEOUT_MS (25s, see backend/src/server.js)
      # room to finish draining before the kubelet sends SIGKILL.
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: backend
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: greenpay/backend:1.0.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: greenpay-config
            - secretRef:
                name: greenpay-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
  strategy:
    canary:
      canaryService: backend-canary
      stableService: backend-stable
      trafficRouting:
        nginx:
          stableIngress: backend-ingress
          additionalIngressAnnotations:
            canary-by-header: X-Canary
      analysis:
        templates:
          - templateName: backend-error-rate
          - templateName: backend-latency
        startingStep: 2
        args:
          - name: service
            value: backend-canary.greenpay.svc.cluster.local
      steps:
        - setWeight: 10
        - pause: { duration: 2m }
        - setWeight: 30
        - pause: { duration: 2m }
        - setWeight: 60
        - pause: { duration: 2m }
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: backend-stable
  namespace: greenpay
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-canary
  namespace: greenpay
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: greenpay
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: greenpay.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-stable
                port:
                  number: 4000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-canary-ingress
  namespace: greenpay
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "100"
spec:
  ingressClassName: nginx
  rules:
    - host: greenpay.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-canary
                port:
                  number: 4000
---
# Socket.IO gets its own Ingress, separate from the /api rules above, for three
# reasons.
#
# 1. It was not routed at all. Every ingress rule here matches /api, and the
#    Socket.IO client connects to /socket.io/ — so the live feed's handshake
#    reached no backend. In the Helm chart it was worse than a 404: the
#    catch-all "/" rule sent it to the frontend service, which runs no
#    Socket.IO server.
#
# 2. Session affinity belongs on this path and nowhere else. Socket.IO opens
#    with HTTP long-polling and upgrades afterwards, and every request in that
#    handshake — including the POST carrying the session id — must reach the
#    pod that issued it, or the client is told its session is unknown and
#    restarts the handshake in a loop. Pinning /api the same way would defeat
#    load balancing across replicas for no benefit, since REST requests are
#    stateless.
#
#    Affinity is the chosen answer rather than forcing transports:
#    ["websocket"]. WebSocket-only removes the need for affinity entirely, but
#    it also removes the fallback that keeps the feed working for donors behind
#    corporate proxies and TLS-terminating middleboxes that break the Upgrade.
#    The trade-off is written up in docs/realtime.md.
#
# 3. It must not inherit rewrite-target: / from the rules above, which would
#    rewrite the handshake URI and break it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-socket-ingress
  namespace: greenpay
  annotations:
    # Pin a client to one pod for the handshake and the connection that follows.
    nginx.ingress.kubernetes.io/affinity: "cookie"
    # "persistent" keeps the client on its pod across the upgrade rather than
    # rebalancing mid-handshake, which "balanced" is free to do.
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "greenpay_realtime"
    nginx.ingress.kubernetes.io/session-cookie-path: "/socket.io"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "86400"
    nginx.ingress.kubernetes.io/session-cookie-expires: "86400"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "Lax"
    # A pinned pod that goes away must release its clients rather than
    # blackholing them until the cookie expires.
    nginx.ingress.kubernetes.io/session-cookie-change-on-failure: "true"
    # An idle live feed is normal — donations are bursty. The nginx default of
    # 60s would tear down healthy sockets between events, producing exactly the
    # reconnect churn this feature is meant to avoid.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: greenpay.local
      http:
        paths:
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: backend-stable
                port:
                  number: 4000

---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: backend-error-rate
  namespace: greenpay
spec:
  args:
    - name: service
  metrics:
    - name: error-rate
      interval: 1m
      count: 5
      successCondition: result[0] < 0.05
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{
              service="{{args.service}}",
              code=~"5.*"
            }[2m])) /
            sum(rate(http_requests_total{
              service="{{args.service}}"
            }[2m]))
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: backend-latency
  namespace: greenpay
spec:
  args:
    - name: service
  metrics:
    - name: latency-p99
      interval: 1m
      count: 5
      successCondition: result[0] < 500
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc.cluster.local:9090
          query: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket{
                service="{{args.service}}"
              }[2m])) by (le)
            ) * 1000
