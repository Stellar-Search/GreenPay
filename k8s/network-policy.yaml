apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: greenpay
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  namespace: greenpay
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    - podSelector:
        matchLabels:
          app: summary-worker
    ports:
    - protocol: TCP
      port: 5432
---
# default-deny-ingress above selects every pod in the namespace, so without this
# the backend cannot reach Redis at all — and because the realtime module is
# built to degrade rather than crash when its store is unreachable, the symptom
# would be a live feed that quietly reaches only one pod's clients: precisely
# the bug Redis was introduced to fix, reintroduced by a missing policy.
#
# summary-worker is included because it publishes ai_summary_ready through the
# same adapter.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis
  namespace: greenpay
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    - podSelector:
        matchLabels:
          app: summary-worker
    ports:
    - protocol: TCP
      port: 6379
---
# Without these, default-deny-ingress above blackholes the entire application:
# it selects every pod in the namespace and allows nothing, and the only other
# policy covers Postgres. Applying k8s/ as-is left the ingress controller
# unable to reach the frontend or backend, and the frontend unable to reach the
# backend.
#
# The namespaceSelector matches the ingress-nginx controller's namespace via
# the kubernetes.io/metadata.name label that Kubernetes applies automatically.
# Change it if the cluster runs its nginx controller somewhere else — every
# Ingress in k8s/ declares ingressClassName: nginx.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: greenpay
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values: [frontend, backend]
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 4000
---
# The frontend server-renders pages that call the backend API directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: greenpay
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 4000
