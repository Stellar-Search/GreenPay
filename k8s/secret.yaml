apiVersion: v1
kind: Secret
metadata:
  name: greenpay-secrets
  namespace: greenpay
type: Opaque
# Local/dev placeholder only. No credential is committed: fill these with
# `kubectl -n greenpay create secret generic greenpay-secrets ...` or apply
# the Helm chart with secrets.provider=external (External Secrets Operator).
# Do not put production passwords in this file.
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: ""
  POSTGRES_DB: "greenpay"
  DATABASE_URL: "postgres://postgres@postgres-svc:5432/greenpay"
  RESEND_API_KEY: ""
  ADMIN_API_KEY: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
