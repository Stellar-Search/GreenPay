apiVersion: v1
kind: Secret
metadata:
  name: greenpay-secrets
  namespace: greenpay
  labels:
    app.kubernetes.io/name: greenpay
    app.kubernetes.io/part-of: greenpay
    app.kubernetes.io/component: secrets
type: Opaque
# Local/dev placeholder file only. No plaintext credentials are committed.
#
# Production / Staging:
# Use External Secrets Operator with `k8s/secret-store.yaml` and `k8s/external-secret.yaml`
# to sync credentials securely from AWS Secrets Manager, GCP Secret Manager, or HashiCorp Vault.
#
# Local Development:
# Run `bash scripts/setup-local-secrets.sh` to generate local dev secrets or populate
# stringData using environment variables out-of-band:
#   kubectl -n greenpay create secret generic greenpay-secrets \
#     --from-literal=POSTGRES_USER=postgres \
#     --from-literal=POSTGRES_PASSWORD=your_dev_password \
#     --from-literal=DATABASE_URL=postgres://postgres:your_dev_password@postgres-svc:5432/greenpay
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: ""
  POSTGRES_PASSWORD_PREVIOUS: ""
  POSTGRES_DB: "greenpay"
  DATABASE_URL: "postgres://postgres@postgres-svc:5432/greenpay"
  DATABASE_URL_PREVIOUS: ""
  RESEND_API_KEY: ""
  ADMIN_API_KEY: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  CREDENTIAL_ISSUED_AT_POSTGRES: ""
  CREDENTIAL_ISSUED_AT_ADMIN: ""
