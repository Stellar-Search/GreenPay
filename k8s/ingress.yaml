apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: greenpay-ingress
  namespace: greenpay
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Production uses cert-manager via the Helm overlay
    # (ingress.tls.clusterIssuer). Local clusters populate greenpay-tls
    # out-of-band (mkcert / self-signed) — Let's Encrypt will not issue
    # for the .local host below.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - greenpay.local
      secretName: greenpay-tls
  rules:
    - host: greenpay.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-svc
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-svc
                port:
                  number: 3000
