apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: greenpay-secret-store
  namespace: greenpay
  labels:
    app.kubernetes.io/name: greenpay
    app.kubernetes.io/part-of: greenpay
    app.kubernetes.io/component: secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: greenpay-external-secrets-sa
