apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: greenpay

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - secret-store.yaml
  - external-secret.yaml
  - postgres.yaml
  # Backs the Socket.IO adapter and the realtime replay stream. Without it the
  # live feed silently reaches only the clients of whichever pod emitted.
  - redis.yaml
  - backend.yaml
  - frontend.yaml
  - hpa.yaml
  # Ingress is now defined inside backend.yaml and frontend.yaml
  # with canary routing support — removed standalone ingress.yaml
  # ML workload manifests (scheduler-annotated)
  - ml-workloads/node-labels.yaml
  - ml-workloads/summary-worker.yaml
  - ml-workloads/ml-inference.yaml
  - ml-workloads/ml-training.yaml
  - network-policy.yaml
  # PodDisruptionBudgets. Selectors verified against the Rollout pod labels in
  # backend.yaml, frontend.yaml and ml-workloads/. Present in the tree but
  # never referenced here, so kustomize never created them.
  - pdb.yaml

components:
  # Deploy the custom scheduler infrastructure.
  # Apply separately with: kubectl apply -k k8s/scheduler/
  # Listed here for documentation; exclude from base apply if not yet deployed.
